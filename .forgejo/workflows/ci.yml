# Forgejo-canonical CI gate for the tap audit surface.
#
# `just audit` remains the canonical local command, but the pinned
# agentic-os/dev-base image used by this repo does not ship Homebrew today, so
# CI falls back to the smallest useful static guard: Ruby syntax checks for
# every Formula file. Follow-up: swap this job back to `just audit` once
# the image grows brew.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  formula-syntax:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v4

      - run: bash scripts/ci-formula-syntax.sh
      - name: Alert Sentry on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_CI_DSN }}
        run: python3 scripts/alert_sentry.py
