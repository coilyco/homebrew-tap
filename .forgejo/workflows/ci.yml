# Forgejo-canonical CI gate for the tap audit surface.
#
# `ward exec audit` remains the canonical local command, but the pinned
# agentic-os/dev-base image used by this repo does not ship Homebrew today, so
# CI falls back to the smallest useful static guard: Ruby syntax checks for
# every Formula file. Follow-up: swap this job back to `ward exec audit` once
# the image grows brew.

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  formula-syntax:
    runs-on: docker
    container: forgejo.coilysiren.me/coilyco-flight-deck/agentic-os:release
    steps:
      - uses: actions/checkout@v4

      - run: bash scripts/ci-formula-syntax.sh
      - name: Alert Telegram on main failure
        if: ${{ failure() && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_RED_CHAT_ID }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow }}
          JOB: ${{ github.job }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          API_BASE: https://api.telegram.org
        run: python3 scripts/ci-telegram-alert.py
